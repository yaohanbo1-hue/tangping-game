name: build-check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 存档基线回归
        run: node tests/smoke.test.js

      - name: 纯战斗与剧情状态回归
        run: node tests/campaign.test.js

      - name: 敌人生命与无限边界回归
        run: node tests/balance.test.js

      - name: 经济、科技与真实伤害回归
        run: |
          node tests/economy.test.js
          node tests/combat.test.js
          node tests/buildings.test.js
          node tests/visual-events.test.js
          node tests/enemies.test.js
          node tests/enemy-abilities.test.js
          node tests/refinements.test.js
          node tests/detail-consistency.test.js
          node tests/presentation.test.js
          node tests/telemetry.test.js
          node tests/narrative.test.js
          node tests/boss-encounters.test.js
          node tests/knockback-bounds.test.js
          node tests/resonance.test.js
          node tests/reactions.test.js
          node tests/meteor.test.js
          node tests/lottery.test.js
          node tests/enemy-counterplay.test.js
          node tests/device-lab.test.js
          node tests/build.test.js
          node tests/license.test.js

      - name: 从零资源的完整战役与策略矩阵
        run: node tests/campaign-matrix.js


      - name: 可重复战斗对照模拟
        run: node tests/simulate.js

      - name: 32个建筑分支投入与实际结算对照
        run: node tests/branch-benchmark.js

      - name: 保存模拟原始结果
        uses: actions/upload-artifact@v4
        with:
          name: balance-simulation
          path: |
            artifacts/balance-simulation.json
            artifacts/campaign-matrix.json
            artifacts/branch-benchmark.json

      - name: 构建单文件产物
        run: node build.js

      - name: 校验构建产物与仓库一致
        run: git diff --exit-code -- shoudengren.html index.html

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装固定版本浏览器测试工具
        run: npm install --ignore-scripts --package-lock=false
      - name: 安装浏览器
        run: npx playwright install --with-deps chromium webkit
      - name: 浏览器交互、触控与帧时间
        run: |
          node tests/scene-art.test.js
          node tests/building-art.test.js
          node tests/enemy-art.test.js
          node tests/text-art.test.js
          node tests/audio.browser.test.js
          node tests/narrative.browser.test.js
          node tests/story-acts.browser.test.js
          node tests/boss-encounters.browser.test.js
          node tests/meteor.browser.test.js
          node tests/boss-warning-art.browser.test.js
          node tests/ui-responsive.browser.test.js
          node tests/phone-room.browser.test.js
          node tests/device-lab.browser.test.js
          node tests/polish.browser.test.js
          node tests/mobile.browser.test.js
          node tests/enemy-actions.browser.test.js
          node tests/display.browser.test.js
          node tests/browser.test.js
      - name: 保存实际画面、音频与验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            artifacts/browser/
            artifacts/scene/
            artifacts/buildings/
            artifacts/enemies/
            artifacts/bestiary/
            artifacts/polish/
            artifacts/mobile/
            artifacts/display/
            artifacts/audio/
            artifacts/narrative/
            artifacts/story-acts/
            artifacts/bosses/
            artifacts/boss-warning-art/
            artifacts/ui-responsive/
            artifacts/phone-room/
            artifacts/device-reports/
